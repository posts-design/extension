<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <link rel="stylesheet" href="newtab.css">
  <script src="theme.js"></script>
  <script src="newtab.js" defer></script>
</head>
<body>
  <main id="app"></main>
  <!-- The ambient light's cap in dark mode: each colour channel stops at 40%, so bright areas don't lead. -->
  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <filter id="cap" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0.1 0.2 0.3 0.4 0.4 0.4 0.4 0.4 0.4 0.4"/>
        <feFuncG type="table" tableValues="0 0.1 0.2 0.3 0.4 0.4 0.4 0.4 0.4 0.4 0.4"/>
        <feFuncB type="table" tableValues="0 0.1 0.2 0.3 0.4 0.4 0.4 0.4 0.4 0.4 0.4"/>
      </feComponentTransfer>
    </filter>
  </svg>
</body>
</html>
